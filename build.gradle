import groovy.json.JsonSlurper

plugins {
	id 'java'
	id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
	id 'com.gradleup.shadow' version '9.0.0-beta4'
	id 'com.github.gmazzo.buildconfig' version '5.5.1'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.mod_id
}

repositories {
	mavenLocal()
	mavenCentral()
	maven {
		name = "meteor-maven"
		url = "https://maven.meteordev.org/releases"
	}
	maven {
		name = "meteor-maven"
		url = "https://maven.meteordev.org"
	}
	maven { url = "https://maven.lavalink.dev/releases" }
	maven { url = "https://maven.lavalink.dev/snapshots" }
	maven { url = "https://jitpack.io" }
	maven { url = "https://packages.jetbrains.team/maven/p/ui/dev" }
}

// Hàm tự động gọi GitHub API lấy commit SHA mới nhất của youtube-source nhánh main
// (2026-08-20: repo's default branch is "main", not "master" -- the old "master" URL 404'd on
// every build, so this always silently fell through to the hardcoded fallback SHA below and
// never actually updated. Confirmed via the crash log's own yts.version matching that fallback
// verbatim. Fixed to the real branch name + refreshed the fallback to a current commit.)
def getLatestYtCommit = { ->
	try {
		def url = new URI("https://api.github.com/repos/lavalink-devs/youtube-source/commits/main").toURL()
		def conn = (HttpURLConnection) url.openConnection()
		conn.setRequestProperty("User-Agent", "Gradle-Build-Script")
		conn.setConnectTimeout(3000)
		conn.setReadTimeout(3000)

		def json = new JsonSlurper().parse(conn.getInputStream())
		conn.disconnect()
		return json.sha
	} catch (Exception e) {
		// Mã SHA dự phòng nếu không có mạng hoặc bị giới hạn API -- refreshed 2026-08-20 to a
		// commit that includes the TV-client PS4 User-Agent + client-version fixes.
		return "f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Minecraft 26.x ships unobfuscated: the jar already carries Mojang's
	// official names, so no `mappings` declaration is needed (or possible —
	// there is no client_mappings artifact for these versions).
	// Unobfuscated Minecraft: mods no longer need remapping, so plain
	// `implementation` replaces the old `modImplementation`.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation(shadow("org.reflections:reflections:0.10.2"))
	implementation(shadow("meteordevelopment:discord-ipc:1.1"))

	// Skija native GPU rendering
	def skijaVersion = "0.143.17"
	def typesVersion = "0.2.0"
	implementation "io.github.humbleui:types:${typesVersion}"
	implementation "io.github.humbleui:skija-shared:${skijaVersion}"
	implementation "io.github.humbleui:skija-windows-x64:${skijaVersion}"
	implementation "io.github.humbleui:skija-linux-x64:${skijaVersion}"
	implementation "io.github.humbleui:skija-macos-x64:${skijaVersion}"
	implementation "io.github.humbleui:skija-macos-arm64:${skijaVersion}"

	// Lavaplayer & YouTube audio engine (Tự động cập nhật snapshot từ commit mới nhất)
	def lavaplayerVersion = "2.2.7"
	def ytSourceVersion = "${getLatestYtCommit()}-SNAPSHOT"
	def jacksonVersion = "2.18.3"
	def rhinoVersion = "1.9.1"

	implementation "commons-logging:commons-logging:1.3.0"
	implementation "dev.arbjerg:lavaplayer:${lavaplayerVersion}"
	implementation "dev.arbjerg:lava-common:${lavaplayerVersion}"
	implementation "dev.arbjerg:lavaplayer-natives:${lavaplayerVersion}"
	implementation "dev.lavalink.youtube:common:${ytSourceVersion}"

	implementation "org.apache.httpcomponents:httpclient:4.5.14"
	implementation "org.apache.httpcomponents:httpcore:4.4.16"
	implementation "commons-io:commons-io:2.13.0"
	implementation "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}"
	implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
	implementation "com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}"
	implementation "com.grack:nanojson:1.8"
	implementation "org.mozilla:rhino:${rhinoVersion}"
	implementation "org.mozilla:rhino-engine:${rhinoVersion}"

	testImplementation "net.jqwik:jqwik:1.9.2"
	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testImplementation "org.mockito:mockito-core:5.18.0"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

def getCommitHash = { ->
	def gitProcess = 'git rev-parse HEAD'.execute()
	gitProcess.waitFor()
	return gitProcess.text.trim().take(10)
}

def getRevisionCount = { ->
	def gitProcess = 'git rev-list --all --count'.execute()
	gitProcess.waitFor()
	return gitProcess.text.trim()
}

buildConfig {
	className("BuildConstants")
	packageName(group)

	buildConfigField(String, 'MOD_NAME', project.mod_name)
	buildConfigField(String, 'MOD_ID', project.mod_id)
	buildConfigField(String, 'MOD_VERSION', project.mod_version)
	buildConfigField(String, 'MINECRAFT_VERSION', project.minecraft_version)
	buildConfigField(String, 'GIT_HASH', getCommitHash())
	buildConfigField(String, 'GIT_REVISION', getRevisionCount())
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs += ['-Xmaxerrs', '9000', '-Xmaxwarns', '100']
}

loom {
	accessWidenerPath = file("src/main/resources/euclient.accesswidener")
}

// DiscordRPC works under the 1.21.4 project (Java 21 target) but silently fails to open the
// local IPC pipe here (Java 25 target, see JavaCompile.release above -- this is the one real
// difference between the two projects' build config; RPCModule.java itself is otherwise
// unchanged). Every `gradlew.bat` invocation all session has shown "WARNING: A restricted
// method in java.lang.System has been called ... will be blocked in a future release unless
// native access is enabled" for OTHER native-backed dependencies (JNA, native-platform) --
// discord-ipc's own Windows named-pipe I/O is plausibly hitting the same JDK 21->25 native-
// access tightening. Untested (needs a live retest with Discord running) -- if this doesn't
// fix it, revert and look elsewhere; it's a cheap, reversible, JVM-arg-only change.
tasks.named("runClient") {
	jvmArgs "--enable-native-access=ALL-UNNAMED"
}

// Lombok wired manually instead of via io.freefair.lombok: that plugin (8.11,
// built for Gradle 8) silently fails to add Lombok to javac's -processorpath
// under Gradle 9.6.1, so annotation processing no-ops and no getters/
// constructors generate. Declaring compileOnly + annotationProcessor directly
// is the standard, version-agnostic wiring. 1.18.42 supports JDK 25.
dependencies {
	compileOnly "org.projectlombok:lombok:1.18.42"
	annotationProcessor "org.projectlombok:lombok:1.18.42"
	testCompileOnly "org.projectlombok:lombok:1.18.42"
	testAnnotationProcessor "org.projectlombok:lombok:1.18.42"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

jar {
	// Unobfuscated Minecraft removes Loom's remapJar step, so the shadow jar is
	// now the distributable. Give the plain jar a classifier to avoid colliding
	// with the shadow jar's output name.
	archiveClassifier.set("slim")

	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

shadowJar {
	configurations = [project.configurations.shadow]
	// No remap step means this is the final mod jar.
	archiveClassifier.set("")

	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}

	doLast {
		copy {
			from archiveFile
			into file('test-proxy/.minecraft/mods')
		}
	}
}

assemble.dependsOn(shadowJar)
build.dependsOn(shadowJar)

tasks.register("exportMcSources", Copy) {
    dependsOn "genSources"

    doFirst {
        def sourceJars = fileTree(".gradle/loom-cache/").matching {
            include "**/*-sources.jar"
        }.files

        if (sourceJars.isEmpty()) {
            throw new GradleException("No sources jar found. Run genSources first.")
        }

        // Pick the most recent one (usually correct)
        def latestJar = sourceJars.max { it.lastModified() }

        println "Using sources jar: ${latestJar}"

        from(zipTree(latestJar))
        into("$buildDir/exported-sources")
    }
}